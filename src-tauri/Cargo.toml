[package]
name = "song-audio-bureau"
version = "0.1.0"
description = "Studio de musique song-audio, version de bureau"
authors = ["aL00ss"]
license = "GPL-3.0-only"
repository = "https://github.com/aL00ss/song-audio-bureau"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "song_audio_bureau_lib"
# bureau seulement : la forme cdylib (mobile) dépasse la limite d’exports du lieur GNU sous Windows
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
moteur = { version = "0.1.0", path = "../moteur" }
tauri-plugin-dialog = "2"
