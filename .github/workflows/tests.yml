name: Tests

on:
  push:
  pull_request:

jobs:
  # Moteur, modèle du projet et interface (egui_kittest), sur les trois systèmes.
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bibliothèques système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev
      - name: Tests (moteur, projet, interface)
        run: cargo test --workspace --release
      - name: Construction de l'application
        run: cargo build -p studio --release

  # Installeurs : NSIS (Windows), .dmg (macOS), .deb et AppImage (Linux).
  installeurs:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
          - os: macos-latest
            formats: dmg
          - os: ubuntu-22.04
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bibliothèques système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev
      - name: Outil d'empaquetage
        run: cargo install cargo-packager --locked
      - name: Installeurs
        run: cargo packager -p studio --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: installeur-${{ runner.os }}
          path: |
            target/installeurs/*.exe
            target/installeurs/*.dmg
            target/installeurs/*.deb
            target/installeurs/*.AppImage
          retention-days: 30
