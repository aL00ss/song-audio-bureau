name: Tests

on:
  push:
  pull_request:

jobs:
  # L'interface (reprise de song-audio) : linter, tests unitaires, tests navigateur.
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linter
        run: npm run lint
      - name: Tests unitaires
        run: npm test
      - name: Construction (types compris)
        run: npm run build
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Tests navigateur
        run: npm run test:e2e
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-interface
          path: test-results
          retention-days: 7

  # Le moteur Rust et l'application, sur les trois systèmes.
  moteur:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Bibliothèques système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - run: npm ci
      - name: Construction de l'interface
        run: npm run build
      - name: Tests du moteur
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Construction de l'application
        run: npx tauri build --no-bundle

  # L'application native (Rust, egui) : moteur, modèle du projet, interface (egui_kittest).
  natif:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bibliothèques système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev
      - name: Tests (moteur, projet, interface)
        run: cargo test --workspace --release
      - name: Construction de l'application
        run: cargo build -p studio --release

  # La vraie fenêtre de bureau (WebView2), pilotée par Playwright.
  fenetre:
    needs: moteur
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Construction de l'application
        run: npx tauri build --no-bundle
      - name: Tests de la fenêtre
        run: node outils/tests-bureau.mjs src-tauri/target/release/song-audio-bureau.exe
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-fenetre
          path: test-results
          retention-days: 7
